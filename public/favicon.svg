<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="bansik 兒童發展地圖">
  <!-- 地圖圖釘＋中間挖空的圓：這個站在做的事就是「現在該做什麼、附近哪裡可以去」。
       綠色是 design-tokens 的 color-pass oklch(0.48 0.16 150)，站上標示「現在這一階段」
       （SVG 的註解不能出現連續兩個減號，所以 token 名稱這裡省掉前綴）
       用的就是它。SVG 不支援 @supports，所以直接寫 hex fallback 值。
       形狀刻意只有兩個元素——16px 的分頁圖示上，再多的細節都會糊成一團。 -->
  <path fill="#1e8050"
        d="M16 30.5c-.5 0-.9-.2-1.2-.6C10.3 24.2 7 20 7 15A9 9 0 0 1 25 15c0 5-3.3 9.2-7.8 14.9-.3.4-.7.6-1.2.6z"/>
  <circle cx="16" cy="14.6" r="3.6" fill="#f5f6f8"/>
</svg>
