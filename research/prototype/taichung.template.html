<title>__COUNTY__兒童發展地圖</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
  /* 首頁是一條問題鏈：孩子幾個月大 → 到哪一站 → 現在該做什麼 → 去哪裡。
     「現在該做什麼」是主角，其餘是輔助，所以空間分配也照這個主從關係，
     不讓四個區塊平鋪搶空間。內容夠少，正常字級就成立。 */
  :root {
    --paper: #F7F8F4;
    --card: #FFFFFF;
    --ink: #1C2B26;
    --ink-soft: #55655E;
    --seal: #2F6F5E;
    --seal-weak: #E3EDE7;
    --alert: #B4462F;
    --alert-weak: #F6E7E2;
    --line: #D6DCD4;
    --stamp: #EDF1EA;
    --serif: "Noto Serif TC", "Songti TC", serif;
    --sans: "Noto Sans TC", -apple-system, "PingFang TC", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #141A18; --card: #1C2421; --ink: #E8EDE7; --ink-soft: #9AAAA2;
      --seal: #6FBFA3; --seal-weak: #1E3830; --alert: #E08268; --alert-weak: #3A241E;
      --line: #2E3A35; --stamp: #222C28;
    }
  }
  :root[data-theme="dark"] {
    --paper: #141A18; --card: #1C2421; --ink: #E8EDE7; --ink-soft: #9AAAA2;
    --seal: #6FBFA3; --seal-weak: #1E3830; --alert: #E08268; --alert-weak: #3A241E;
    --line: #2E3A35; --stamp: #222C28;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    height: 100%; max-width: 1100px; margin: 0 auto;
    padding: 20px 24px 12px;
    display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto auto; gap: 12px;
  }
  h1, h2, .lead { font-family: var(--serif); margin: 0; }
  h1 { font-size: 19px; }
  a { color: var(--seal); }
  .num { font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }

  /* 1 孩子幾個月大 */
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 26px; }
  .brand { margin-inline-end: auto; }
  .brand span { font-size: 12px; letter-spacing: .14em; color: var(--ink-soft); margin-inline-start: 8px; }
  .field { display: flex; align-items: center; gap: 8px; }
  .field label { font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
  input[type="range"] { width: 190px; accent-color: var(--seal); }
  input[type="date"] {
    font: inherit; font-size: 14px; padding: 4px 6px;
    border: 1px solid var(--line); border-radius: 3px; background: var(--card); color: var(--ink);
  }
  .age { font-family: var(--serif); font-size: 24px; line-height: 1; white-space: nowrap; }
  .age small { font-size: 13px; color: var(--ink-soft); font-family: var(--sans); }

  /* 2 到哪一站：6 次發展篩檢壓成一條細軸 */
  .track { display: flex; align-items: flex-start; gap: 0; padding: 0 2px; }
  .stop { flex: 1 1 0; min-width: 0; text-align: center; position: relative; }
  .stop::before {
    content: ""; position: absolute; top: 7px; left: -50%; width: 100%; height: 2px;
    background: var(--line);
  }
  .stop:first-child::before { display: none; }
  .stop .dot {
    position: relative; width: 14px; height: 14px; margin: 0 auto 3px;
    border-radius: 50%; border: 2px solid var(--line); background: var(--paper);
  }
  .stop.done .dot { background: var(--line); }
  /* 叫 current 不叫 now：主角卡片的 class 就是 .now，同名會讓卡片的白底邊框內距
     整套套到時間軸的當前站上，畫面會多出一個莫名其妙的方框。 */
  .stop.current .dot { border-color: var(--seal); background: var(--seal); box-shadow: 0 0 0 4px var(--seal-weak); }
  .stop .lbl { font-size: 12px; color: var(--ink-soft); line-height: 1.35; }
  .stop.current .lbl { color: var(--seal); font-weight: 700; }

  /* 3 現在該做什麼（主角） */
  .now {
    min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent;
    border: 1px solid var(--line); border-radius: 6px; background: var(--card);
    padding: 14px 16px;
  }
  .now::-webkit-scrollbar { width: 8px; }
  .now::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  .now .eyebrow { font-size: 13px; color: var(--seal); letter-spacing: .04em; }
  .now .lead { font-size: 21px; line-height: 1.3; margin-top: 2px; }
  .now .when { color: var(--ink-soft); margin-top: 4px; }
  .action {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
    margin-top: 14px; padding: 12px 14px; background: var(--stamp); border-radius: 4px;
  }
  .action .tag { font-size: 12.5px; color: var(--seal); }
  .action .name { font-weight: 500; }
  .action .warn { color: var(--alert); font-weight: 700; }
  .also { margin-top: 12px; font-size: 13px; color: var(--ink-soft); }
  .also b { font-weight: 500; color: var(--ink); }

  /* 4 去哪裡 */
  /* align-items:start：左卡內容少，不要被 grid 拉成跟右卡等高而多佔一截空白 */
  .go { display: grid; grid-template-columns: 1fr 1.35fr; gap: 16px; align-items: start; }
  .card { border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; background: var(--card); }
  .card.call { border-color: var(--seal); background: var(--seal-weak); }
  .card h2 { font-size: 14px; margin: 0 0 5px; }
  .card h2 .sub { font-family: var(--sans); font-weight: 400; font-size: 12.5px; color: var(--ink-soft); margin-inline-start: 8px; }
  .card.call h2 { color: var(--seal); }
  .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: 14px; }
  .row + .row { margin-top: 3px; border-top: 1px solid var(--line); padding-top: 3px; }
  .tel { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--ink-soft); }
  .hint { margin: 5px 0 0; font-size: 12px; color: var(--ink-soft); }
  .pill {
    display: inline-block; font-size: 11.5px; padding: 0 6px; border-radius: 3px;
    background: var(--seal-weak); color: var(--seal); margin-inline-end: 5px;
  }
  .pill.key { background: var(--alert-weak); color: var(--alert); }
  .quota { margin-top: 5px; font-size: 12.5px; color: var(--ink-soft); }

  /* footer 同時是內頁入口：首頁放不下的東西（預防保健 9 次、上百家機構、補助規則、
     教育素材）都從這裡進去。做成獨立一列會再吃掉 30px 版面高度，所以併進 footer。 */
  footer { border-top: 1px solid var(--line); padding-top: 7px; font-size: 12px; color: var(--ink-soft); }
  footer nav { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 4px; }
  footer nav a { font-size: 12.5px; text-decoration: none; border-bottom: 1px solid var(--seal-weak); }
  footer nav a:hover { border-bottom-color: var(--seal); }

  /* 內頁：首頁是一屏不捲動，內頁相反——內容本來就長，就讓它捲。 */
  body.sub { overflow: auto; }
  body.sub .app { display: none; }
  .page { max-width: 1100px; margin: 0 auto; padding: 18px 24px 56px; }
  .page .back { font-size: 13px; text-decoration: none; }
  .page h1 { font-size: 22px; margin: 10px 0 2px; }
  .page .sub-lead { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 18px; }
  .page h2 { font-size: 15px; margin: 22px 0 8px; }
  .page section { margin-bottom: 26px; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .tbl th, .tbl td { text-align: start; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tbl th { font-weight: 500; color: var(--ink-soft); font-size: 12.5px; white-space: nowrap; }
  .tbl td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .band { display: flex; flex-wrap: wrap; gap: 6px; }
  .band .cell {
    flex: 1 1 96px; min-width: 0; border: 1px solid var(--line); border-radius: 3px;
    padding: 6px 8px; font-size: 12px; background: var(--card);
  }
  /* 兒童健康手冊的格子：當前月齡落在哪一格就蓋章 */
  .band .cell.on { border-color: var(--seal); background: var(--seal-weak); color: var(--seal); }
  .band .cell b { display: block; font-weight: 500; font-size: 12.5px; color: var(--ink); }
  .band .cell.on b { color: var(--seal); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 10px; }
  .filters select { font: inherit; font-size: 13px; padding: 3px 6px; border: 1px solid var(--line);
                    border-radius: 3px; background: var(--card); color: var(--ink); }
  .count { font-size: 12.5px; color: var(--ink-soft); }
  .geo { font-size: 11.5px; color: var(--ink-soft); }
  .step { border-inline-start: 3px solid var(--line); padding: 2px 0 2px 12px; margin-bottom: 14px; }
  .step.here { border-inline-start-color: var(--seal); }
  .step h3 { font-size: 14px; margin: 0 0 2px; }
  .step p { margin: 0; font-size: 13px; color: var(--ink-soft); }
  .money { font-family: var(--serif); font-size: 20px; }
  .warnbox { border: 1px solid var(--alert); background: var(--alert-weak); border-radius: 4px;
             padding: 10px 12px; font-size: 13px; }

  /* 手機：390px 寬放不下橫排的控制列與 6 格時間軸，一定要改排法，
     不是把兩欄併成一欄就算數。overflow-x 是最後一道防線，避免任何元素撐破畫面。 */
  @media (max-width: 860px) {
    html, body { height: auto; }
    body { overflow-x: hidden; overflow-y: auto; }
    .app {
      height: auto; grid-template-rows: none; gap: 14px;
      padding: 14px 14px 24px; max-width: 100%;
    }

    /* 標題自己一行，出生年月與月齡併在同一列；兩者都要能收縮，390px 才不會被撐破 */
    .bar { flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .brand { flex: 1 0 100%; margin-inline-end: 0; }
    /* 兩個欄位高度不同（日期框比滑桿高），用 stretch + center 讓它們的內容對齊同一條線 */
    .field { flex: 1 1 0; min-width: 0; gap: 6px; align-self: stretch; align-items: center; }
    .field label { flex: 0 0 auto; }
    input[type="date"] { flex: 1 1 auto; min-width: 0; font-size: 13px; padding: 3px 4px; }
    input[type="range"] { flex: 1 1 auto; width: auto; min-width: 60px; }
    /* 單位不能整個藏掉，只剩裸數字看不出是月齡；留「個月」，省掉括號裡的歲數換算 */
    .age { font-size: 18px; }
    .age small { font-size: 11.5px; }

    /* 6 站改 3 欄 2 列，連線在這個排法沒有意義就拿掉 */
    .track { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 8px; }
    .stop::before { display: none; }
    .stop .dot { margin-bottom: 4px; }
    .stop .lbl { font-size: 11.5px; }

    .now { overflow: visible; padding: 14px; }
    .now .lead { font-size: 19px; }
    .action { gap: 2px 8px; }

    .go { grid-template-columns: 1fr; }
    /* 機構名稱長、電話又 nowrap，窄螢幕會把整列撐開 */
    .row { flex-wrap: wrap; }
    .row .tel { white-space: normal; }

    /* 曾經為了省空間把時間軸與「同一時期還有」整個藏掉，只留一家評估中心。
       實測 390×844 的內容只到 557px、底下空了 287px——省下來的空間根本沒人用，
       藏掉反而讓手機看到的比桌機少。現在放回來，手機本來就可以捲。
       （若要再藏，記得機構與它的名額必須整組 .item 一起藏，不然會變成
       「列的是甲醫院、名額寫乙醫院」。） */
    .brand { display: flex; align-items: baseline; gap: 8px; }
    .brand h1 { font-size: 17px; }
    .brand span { margin: 0; }
    .now .when { display: none; }
    footer { font-size: 11.5px; padding-top: 6px; }

    /* 內頁 */
    .page { padding: 14px 14px 40px; }
    .page h1 { font-size: 19px; }

    /* 機構清單在 390px 放不下四欄：電話是 nowrap、機構名又長，實測會把表格撐到 511px，
       整頁橫向捲 145px。555 列的清單橫向捲根本沒法用，所以手機改成一家一張卡片，
       每個欄位自己一行。只改這一張表——其他表格欄位少，在 390px 量過不會溢出。 */
    #ftable, #ftable tbody, #ftable tr, #ftable td { display: block; }
    #ftable tr:first-child { display: none; }      /* 卡片式沒有表頭 */
    #ftable tr { border-bottom: 1px solid var(--line); padding: 8px 0; }
    #ftable td { border: 0; padding: 1px 0; }
    #ftable td.num { white-space: normal; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <div class="bar">
    <div class="brand"><h1>__COUNTY__兒童發展地圖</h1><span>原型</span></div>
    <div class="field">
      <label for="birth">出生年月</label>
      <input type="date" id="birth">
    </div>
    <div class="field">
      <label for="age">月齡</label>
      <input type="range" id="age" min="0" max="84" step="1" value="27">
      <div class="age"><span class="num" id="ageNum">27</span> <small id="ageText">個月大</small></div>
    </div>
  </div>

  <div class="track" id="track"></div>

  <div class="now" id="now"></div>

  <div class="go">
    <div class="card call" id="call"></div>
    <div class="card" id="places"></div>
  </div>

  <footer id="foot"></footer>
</div>

<main class="page" id="page" hidden></main>

<script id="bansik-data" type="application/json">__DATA__</script>
<script>
  const DATA = JSON.parse(document.getElementById('bansik-data').textContent);
  const num = v => (v === '' || v == null ? null : Number(v));
  const el = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // 動態資訊照 entity_key 分組。這些是各縣市衛生局頁解析出來的：門診時間、
  // 預約方式、電話分機。放在機構清單上，不然它們只存在資料層、家長看不到。
  const OBS = {};
  for (const o of DATA.observations || []) (OBS[o.entity_key] ||= []).push(o);
  const OBS_LABEL = {
    clinic_hours: '門診', booking_method: '預約', booking_tel: '分機',
    quota_release_date: '下次開放名額', monthly_capacity: '每月名額',
  };
  // 一家機構可能有好幾筆，同一種只取第一筆；分機只在它比 entity 的電話多給資訊時才顯示
  function obsLine(key, tel) {
    const list = OBS[key] || [];
    const parts = [];
    for (const f of ['clinic_hours', 'booking_method', 'booking_tel']) {
      const hit = list.find(o => o.field === f);
      if (!hit) continue;
      // 電話別重複顯示：entity 存「(04)3604-5483」、衛生局頁存「04-36045483」，
      // 比字串比不出來（格式不同），要比數字。但像「分機12130(初評)、12131(複評)」
      // 這種帶標註的要留著——那是 entity 的電話欄沒有的資訊。
      // 「分機」這兩個字本身不算資訊，先拿掉再判斷，否則「04-36060666 分機4136」
      // 跟電話欄的「(04)36060666#4136」明明一樣，只因為有中文就被當成新資訊。
      if (f === 'booking_tel' && tel) {
        const extra = hit.value.replace(/分機/g, '');
        if (!/[一-鿿]/.test(extra)
            && extra.replace(/\D/g, '') === tel.replace(/\D/g, '')) continue;
      }
      parts.push(`${OBS_LABEL[f]}：${esc(hit.value)}`);
    }
    return parts.length ? `<div class="geo">${parts.join('　')}</div>` : '';
  }

  let age = 27;
  const inBand = t => age >= num(t.month_min) && age < num(t.month_max);

  const SCREENS = DATA.timeline.filter(t => t.kind === '兒童發展篩檢')
    .sort((a, b) => num(a.month_min) - num(b.month_min));

  const NARROW = window.matchMedia('(max-width: 860px)');
  function ageText(m) {
    if (m < 12 || NARROW.matches) return '個月大';   // 窄螢幕省掉括號裡的歲數換算
    const y = Math.floor(m / 12), r = m % 12;
    return '個月大（' + y + ' 歲' + (r ? ' ' + r + ' 個月' : '') + '）';
  }

  function renderTrack() {
    el('track').innerHTML = SCREENS.map((t, i) => {
      const cls = inBand(t) ? 'current' : (age >= num(t.month_max) ? 'done' : '');
      return `<div class="stop ${cls}"><div class="dot"></div>
        <div class="lbl">第 ${i + 1} 次 ${esc(t.age_label)}</div></div>`;
    }).join('');
  }

  // 主角：這個月齡的發展檢查。沒有正在進行的就指向下一次，不要留白。
  function renderNow() {
    const current = SCREENS.find(inBand);
    const next = SCREENS.find(t => num(t.month_min) > age);
    const idx = current ? SCREENS.indexOf(current) + 1 : (next ? SCREENS.indexOf(next) + 1 : null);
    const check = DATA.timeline.find(t => t.kind === '線上發展檢核表' && inBand(t));
    const others = DATA.timeline.filter(t => inBand(t)
      && ['兒童預防保健', '家長紀錄事項', '學前特教安置'].includes(t.kind));

    let head;
    if (current) {
      head = `<div class="eyebrow">現在就是這一次</div>
        <div class="lead">第 ${idx} 次兒童發展篩檢</div>
        <div class="when">${esc(current.age_label)}，由專科醫師就粗大動作、精細動作、語言認知、社會發展四面向檢查。</div>`;
    } else if (next) {
      head = `<div class="eyebrow">這個月齡沒有排定的篩檢</div>
        <div class="lead">下一次是第 ${idx} 次</div>
        <div class="when">${esc(next.age_label)}　在那之前仍可以自己觀察與紀錄。</div>`;
    } else {
      head = `<div class="eyebrow">已滿 7 歲</div>
        <div class="lead">兒童發展篩檢已全部完成</div>
        <div class="when">後續由學校特教系統接手。</div>`;
    }

    const action = check
      ? `<div class="action"><span class="tag">先自己做</span>
          <span class="name"><a href="${esc(check.url)}" target="_blank" rel="noopener">${esc(check.title)}</a></span>
          <span>${esc(check.detail).replace(/(\d+ 題為警訊題)/, '<span class="warn">$1</span>')}</span></div>`
      : '';
    const also = others.length
      ? `<p class="also">同一時期還有：${others.map(o => '<b>' + esc(o.title.replace(/兒童健康手冊「|」/g, '')) + '</b>').join('、')}</p>`
      : '';
    el('now').innerHTML = head + action + also;
  }

  function renderCall() {
    const centers = DATA.entities.filter(e => e.journey_step === '2');
    const first = centers[0];
    if (!first) return;
    el('call').innerHTML = `<h2>不知道從哪開始，先打這支</h2>
      <div class="row"><span>${esc(first.name)}</span><span class="tel">${esc(first.tel)}</span></div>
      <p class="hint">通報轉介中心是單一窗口，${esc(DATA.county)}共 ${centers.length} 區，打這支會幫你轉。</p>`;
  }

  function renderPlaces() {
    const all = DATA.entities.filter(e => e.cat === '聯合評估中心')
      .sort((a, b) => (a.tier === '重點' ? -1 : b.tier === '重點' ? 1 : 0)
        || a.name.localeCompare(b.name, 'zh-Hant'));
    const top = all.slice(0, 2);
    const quota = top.map(e => {
      const rows = DATA.observations.filter(o => o.entity_key === e.entity_key
        && o.field === 'quota_release_date').map(o => o.value).sort();
      return rows.length ? { name: e.name, dates: rows } : null;
    }).find(Boolean);
    // 名額那行必須跟著它所屬的機構一起輸出：先前把它獨立放在清單末尾，
    // 手機版隱藏第 2 列之後就變成「榜上是甲醫院、名額寫乙醫院」，會誤導家長。
    const quotaOf = key => {
      const dates = DATA.observations
        .filter(o => o.entity_key === key && o.field === 'quota_release_date')
        .map(o => o.value).sort();
      return dates.length ? `<p class="quota">下次開放名額 ${esc(dates[0])}（醫院公告，以院方為準）</p>` : '';
    };
    el('places').innerHTML = `<h2>做評估的地方<span class="sub">${esc(DATA.county)} ${all.length} 家，重點中心優先</span></h2>
      ${top.map(e => `<div class="item"><div class="row">
        <span>${e.tier ? `<span class="pill ${e.tier === '重點' ? 'key' : ''}">${esc(e.tier)}</span>` : ''}${esc(e.name)}</span>
        <span class="tel">${esc(e.tel)}</span></div>${quotaOf(e.entity_key)}</div>`).join('')}`;
  }

  function setAge(m) {
    age = Math.max(0, Math.min(84, Math.round(m)));
    el('age').value = age;
    el('ageNum').textContent = age;
    el('ageText').textContent = ageText(age);
    renderTrack(); renderNow();
  }

  // 視窗寬度跨過 860px 要重畫：ageText 會在「27 個月大」與「27 個月大（2 歲 3 個月）」
  // 之間切換，長版在 390px 會把控制列撐破（實測撐到 440px）。只在載入時判斷一次不夠——
  // 手機轉向、桌機縮視窗都會跨過這條線。
  NARROW.addEventListener('change', () => setAge(age));

  el('age').addEventListener('input', e => setAge(+e.target.value));
  el('birth').addEventListener('change', e => {
    if (!e.target.value) return;
    const b = new Date(e.target.value), n = new Date();
    setAge((n.getFullYear() - b.getFullYear()) * 12 + (n.getMonth() - b.getMonth()));
  });

  const NAV = [
    ['checkups', '這個年齡的所有檢查'],
    ['steps', '完整流程五步'],
    ['places', '全部機構'],
    ['map', '哪一區有幾家'],
    ['subsidy', '補助怎麼申請'],
    ['materials', '看懂發展的素材'],
  ];
  el('foot').innerHTML = '<nav>' + NAV.map(([k, t]) =>
    `<a href="#/${k}">${esc(t)}</a>`).join('') + '</nav>'
    + '資料產生於 ' + esc(DATA.generated_at.slice(0, 10))
    + '　來源：社家署、國健署、兒童醫療平台　這裡是路標不是掛號窗口，不做品質排名';

  // ---------- 內頁 ----------
  // 首頁只回答「現在該做什麼」，其餘全部移到這裡。每頁都吃同一份 DATA 與同一個月齡，
  // 所以從首頁點進來看到的內容會跟著滑桿走，不是一份靜態清單。
  const band = (list, label) => `<div class="band">` + list.map(t =>
    `<div class="cell ${inBand(t) ? 'on' : ''}"><b>${esc(t.age_label)}</b>${esc(label(t))}</div>`
  ).join('') + '</div>';

  function pageCheckups() {
    const of = k => DATA.timeline.filter(t => t.kind === k)
      .sort((a, b) => num(a.month_min) - num(b.month_min));
    const scale = of('分齡篩檢量表');
    return `<h1>這個年齡的所有檢查</h1>
      <p class="sub-lead">孩子 ${age} 個月大。亮起來的格子就是現在這一格。
        兒童預防保健和兒童發展篩檢是兩套不同的東西，都印在兒童健康手冊上，很容易混在一起。</p>
      <section><h2>兒童發展篩檢（6 次）</h2>
        <p class="sub-lead">由專科醫師就粗大動作、精細動作、語言認知、社會發展四面向檢查。</p>
        ${band(SCREENS, t => '第 ' + (SCREENS.indexOf(t) + 1) + ' 次')}</section>
      <section><h2>兒童預防保健（9 次）</h2>
        <p class="sub-lead">健保給付，含身體檢查與衛教指導。次數與發展篩檢不同，不要弄混。</p>
        ${band(of('兒童預防保健'), t => '第 ' + (of('兒童預防保健').indexOf(t) + 1) + ' 次')}</section>
      <section><h2>家長自己做的</h2>
        <table class="tbl"><tr><th>年齡</th><th>項目</th><th>內容</th></tr>
        ${DATA.timeline.filter(t => ['線上發展檢核表', '家長紀錄事項'].includes(t.kind) && inBand(t))
          .map(t => `<tr><td>${esc(t.age_label)}</td><td>${t.url
            ? `<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.title)}</a>`
            : esc(t.title)}</td><td>${esc(t.detail || '')}</td></tr>`).join('')
          || '<tr><td colspan="3">這個月齡沒有對應的項目</td></tr>'}</table></section>
      ${scale.length ? `<section><h2>醫師篩檢用的分齡量表</h2>
        <p class="sub-lead">國健署公布的工具，家長可以先看過，知道醫師會問什麼。</p>
        ${band(scale, t => t.title.replace(/兒童發展篩檢量表/, ''))}</section>` : ''}`;
  }

  function pageSteps() {
    const STEPS = [
      // 官方用語不換掉——家長打電話、拿報告時聽到的就是這幾個字，換成白話反而對不上。
      // 但第一次出現時要說清楚那是什麼。
      ['1', '篩檢', '在診所或衛生所做兒童發展篩檢，這是入口。帶兒童健康手冊去，醫師會照四個面向看。'],
      ['2', '通報', '篩檢覺得有疑慮，由「通報轉介中心」接手。它是單一窗口，不知道下一步做什麼就打這支。'],
      ['3', '評估', '到「聯合評估中心」做完整評估，拿到「綜合報告書」——之後申請補助、安排療育都要用這份。這一段最花時間。'],
      ['4', '療育', '依報告書安排療育：醫院復健科、早療機構、社區據點或到宅。自費的部分可以申請補助。'],
      ['5', '學前教育', '銜接幼兒園的學前特教資源與巡迴輔導，滿 6 歲後由學校系統接手。'],
    ];
    const cnt = s => DATA.entities.filter(e => e.journey_step === s).length;
    return `<h1>完整流程五步</h1>
      <p class="sub-lead">每一步由不同機關管，沒有任何一處把它們接起來——這也是這個站想補的那一段。
        括號裡是${esc(DATA.county)}目前的家數。</p>
      ${STEPS.map(([s, name, desc]) => `<div class="step ${cnt(s) ? 'here' : ''}">
        <h3>${s}　${esc(name)}　<span class="count">${cnt(s)} 家</span></h3>
        <p>${esc(desc)}</p></div>`).join('')}
      <section><h2>各類型家數</h2>
        <table class="tbl"><tr><th>說法</th><th>官方分類</th><th class="num">家數</th></tr>
        ${Object.entries(DATA.entities.reduce((m, e) => {
          const k = e.plain_cat + '|' + e.cat;
          m[k] = (m[k] || 0) + 1; return m;
        }, {})).sort((a, b) => b[1] - a[1]).map(([k, n]) => {
          const [plain, cat] = k.split('|');
          return `<tr><td>${esc(plain)}</td><td class="geo">${esc(cat)}</td><td class="num">${n}</td></tr>`;
        }).join('')}</table></section>`;
  }

  function pagePlaces() {
    const dists = Object.keys(DATA.districts).sort((a, b) => a.localeCompare(b, 'zh-Hant'));
    const cats = [...new Set(DATA.entities.map(e => e.plain_cat))];
    return `<h1>全部機構</h1>
      <p class="sub-lead">${esc(DATA.county)}共 ${DATA.entities.length} 家。
        這裡不做品質排名，只列出是什麼、在哪裡、怎麼打電話。</p>
      <div class="filters">
        <label>行政區 <select id="fd"><option value="">全市</option>
          ${dists.map(d => `<option>${esc(d)}</option>`).join('')}</select></label>
        <label>類型 <select id="fc"><option value="">全部</option>
          ${cats.map(c => `<option>${esc(c)}</option>`).join('')}</select></label>
        <span class="count" id="fcount"></span>
      </div>
      <table class="tbl" id="ftable"></table>`;
  }

  function fillPlaces() {
    const d = el('fd').value, c = el('fc').value;
    const list = DATA.entities.filter(e => (!d || e.district === d) && (!c || e.plain_cat === c))
      .sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
    el('fcount').textContent = `${list.length} 家`
      + (d || c ? `（全市共 ${DATA.entities.length} 家）` : '');
    // 區級座標是整區共用一個點，標出來才不會被當成門牌位置
    el('ftable').innerHTML = '<tr><th>名稱</th><th>類型</th><th>地址</th><th>電話</th></tr>'
      + (list.length ? list.map(e => `<tr>
        <td>${e.tier ? `<span class="pill ${e.tier === '重點' ? 'key' : ''}">${esc(e.tier)}</span>` : ''}${
          e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.name)}</a>` : esc(e.name)}</td>
        <td>${esc(e.plain_cat)}</td>
        <td>${esc(e.address)}${e.geo_level === 'district' ? ' <span class="geo">（座標只到行政區）</span>' : ''}
          ${obsLine(e.entity_key, e.tel)}</td>
        <td class="num">${esc(e.tel)}</td></tr>`).join('')
        : '<tr><td colspan="4">這個組合沒有機構，換一個行政區或類型試試。</td></tr>');
  }

  // 分布圖只畫到行政區，不畫門牌：3,073 家裡只有 1,378 家有門牌座標，其餘是區中心點，
  // 混在一起畫會讓同一區的機構全部疊在一個點上，看起來像「這區只有一家」。
  // 底圖也不放——artifact 的 CSP 擋掉外部圖磚請求，硬要放只會得到一片空白，
  // 所以直接用經緯度投影成 SVG，點的大小就是家數。
  function pageMap() {
    const geo = DATA.district_geo || {};
    const names = Object.keys(geo);
    if (!names.length) return `<h1>哪一區有幾家</h1><p class="sub-lead">這個縣市還沒有行政區座標。</p>`;
    const cnt = n => (DATA.districts[n] || {}).located || 0;
    const lat = n => geo[n].lat, lng = n => geo[n].lng;
    const lats = names.map(lat), lngs = names.map(lng);
    const [la0, la1] = [Math.min(...lats), Math.max(...lats)];
    const [ln0, ln1] = [Math.min(...lngs), Math.max(...lngs)];
    // 經度要乘 cos(緯度) 才不會把地圖橫向拉寬（臺灣約 0.91）
    const k = Math.cos((la0 + la1) / 2 * Math.PI / 180);
    const W = 640, H = 480, PAD = 46;
    const spanX = Math.max((ln1 - ln0) * k, 1e-6), spanY = Math.max(la1 - la0, 1e-6);
    const scale = Math.min((W - PAD * 2) / spanX, (H - PAD * 2) / spanY);
    const cx = n => PAD + ((lng(n) - ln0) * k) * scale + ((W - PAD * 2) - spanX * scale) / 2;
    const cy = n => PAD + (la1 - lat(n)) * scale + ((H - PAD * 2) - spanY * scale) / 2;
    const max = Math.max(...names.map(cnt), 1);
    const r = n => 4 + Math.sqrt(cnt(n) / max) * 26;
    const sorted = [...names].sort((a, b) => cnt(b) - cnt(a));
    return `<h1>哪一區有幾家</h1>
      <p class="sub-lead">圓圈畫在行政區的中心，大小是那一區的機構家數。
        這不是機構的實際位置——點一下圓圈會跳到那一區的清單。</p>
      <svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;height:auto"
           role="img" aria-label="${esc(DATA.county)}各行政區機構家數分布">
        ${sorted.map(n => `<g class="dot-g" data-d="${esc(n)}" style="cursor:pointer">
            <title>${esc(n)} ${cnt(n)} 家</title>
            <circle cx="${cx(n).toFixed(1)}" cy="${cy(n).toFixed(1)}" r="${r(n).toFixed(1)}"
                    fill="var(--seal)" fill-opacity=".26" stroke="var(--seal)" stroke-width="1"/>
            ${cnt(n) >= max * 0.18 ? `<text x="${cx(n).toFixed(1)}" y="${(cy(n) + 4).toFixed(1)}"
                 text-anchor="middle" font-size="11" fill="var(--ink)">${esc(n.replace(/區$/, ''))} ${cnt(n)}</text>` : ''}
          </g>`).join('')}
      </svg>
      <section><h2>各區家數</h2>
        <table class="tbl"><tr><th>行政區</th><th class="num">位於這一區</th><th>看清單</th></tr>
        ${sorted.map(n => `<tr><td>${esc(n)}</td><td class="num">${cnt(n)}</td>
          <td><a href="#/places" data-d="${esc(n)}" class="to-d">看這一區</a></td></tr>`).join('')}
        </table></section>
      <p class="geo">全市 ${DATA.entities.length} 家。行政區中心點取自鄉鎮界圖資；
        機構自己的座標只有 ${DATA.entities.filter(e => e.geo_level === 'address').length} 家是門牌精度。</p>`;
  }

  // 從分布圖點進清單時，要把篩選條件帶過去（先設好再 route，避免閃一下全市再跳）
  let pendingDistrict = '';

  function pageSubsidy() {
    const s = DATA.subsidy;
    if (!s) return `<h1>補助怎麼申請</h1><p class="sub-lead">這個縣市的規則還沒整理。</p>`;
    if (s.status === 'pending') {
      return `<h1>補助怎麼申請</h1>
        <div class="warnbox">${esc(s.county)}的「${esc(s.rule_name)}」查得到計畫名稱，
          但金額沒有公開在任何可以讀到的頁面上。${esc(s.note || '')}</div>`;
    }
    const row = (k, v) => v ? `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>` : '';
    return `<h1>補助怎麼申請</h1>
      <p class="sub-lead">${esc(s.rule_name)}</p>
      <section><h2>每人每月上限</h2>
        <table class="tbl">
          <tr><th>一般戶（多含中低收）</th><td class="money num">${s.monthly_max_general.toLocaleString()} 元</td></tr>
          <tr><th>低收入戶</th><td class="money num">${s.monthly_max_low_income.toLocaleString()} 元</td></tr>
        </table></section>
      <section><h2>細節</h2><table class="tbl">
        ${row('補助項目', (s.items || []).join('、'))}
        ${row('交通費', s.transport)}
        ${row('申請期限', s.apply_window)}
        ${row('另有規定', s.extra)}
        ${row('不補助', s.exclusions)}
      </table></section>
      <p class="geo">金額是療育費與交通費合計的上限，各縣市算法不同。
        資料核對於 ${esc(s.verified_at)}，以
        <a href="${esc(s.source_url)}" target="_blank" rel="noopener">主管機關公告</a>為準；
        這裡只列規則與連結，不代為試算。</p>`;
  }

  function pageMaterials() {
    const m = DATA.materials || {};
    const chk = m['社家署線上兒童發展檢核表'] || {};
    // 素材清單的形狀不一致，三種都要接：國健署量表是純字串陣列、宣導與繪本是物件，
    // 而物件的連結有的是絕對網址、有的是相對路徑（社家署寫 /cecm/...）。
    // 相對路徑直接放進 href 會連到這個頁面自己的網域，變成壞連結。
    const abs = (u, base) => /^https?:/i.test(u) ? u : (base ? base + u : '');
    const list = (arr, n, base) => (arr || []).slice(0, n).map(x => {
      if (typeof x === 'string') return `<li>${esc(x)}</li>`;
      const u = abs(x.url || x.file || x.page || '', base);
      return `<li>${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(x.title)}</a>`
        : esc(x.title)}</li>`;
    }).join('');
    return `<h1>看懂發展的素材</h1>
      <p class="sub-lead">都是官方或公益單位做的，可以直接下載。</p>
      <section><h2>線上發展檢核表（${Object.keys(chk).length} 個年齡層）</h2>
        <table class="tbl"><tr><th>年齡層</th><th class="num">題數</th><th class="num">警訊題</th><th>第一題長這樣</th></tr>
        ${Object.entries(chk).map(([k, v]) =>
          `<tr><td>${esc(k)}</td><td class="num">${v.items ?? ''}</td>
           <td class="num">${v.alerts ?? ''}</td><td>${esc(v.sample || '')}</td></tr>`).join('')}
        </table></section>
      <section><h2>國健署篩檢量表</h2><ul>${list(m['國健署兒童發展篩檢量表'], 12)}</ul></section>
      <section><h2>宣導與繪本</h2>
        <ul>${list(m['社家署宣導資料'], 10, 'https://system.sfaa.gov.tw')}${list(m['CRPD繪本'], 5)}</ul></section>
      <p class="geo">官方素材裡沒有任何一份是寫給孩子本人看的，手足的部分也只有民間單位有。</p>`;
  }

  const VIEWS = {
    checkups: pageCheckups, steps: pageSteps, places: pagePlaces, map: pageMap,
    subsidy: pageSubsidy, materials: pageMaterials,
  };

  function route() {
    const key = location.hash.replace(/^#\/?/, '');
    const view = VIEWS[key];
    document.body.classList.toggle('sub', !!view);
    el('page').hidden = !view;
    if (!view) { el('page').innerHTML = ''; return; }
    el('page').innerHTML = `<a class="back" href="#/">← 回到「現在該做什麼」</a>` + view();
    if (key === 'places') {
      el('fd').addEventListener('change', fillPlaces);
      el('fc').addEventListener('change', fillPlaces);
      // 從分布圖點進來時帶著行政區，套用後就清掉，不然之後回到清單還會被黏住
      if (pendingDistrict) { el('fd').value = pendingDistrict; pendingDistrict = ''; }
      fillPlaces();
    }
    if (key === 'map') {
      const go = d => { pendingDistrict = d; location.hash = '#/places'; };
      el('page').querySelectorAll('.dot-g').forEach(g =>
        g.addEventListener('click', () => go(g.dataset.d)));
      el('page').querySelectorAll('.to-d').forEach(a =>
        a.addEventListener('click', e => { e.preventDefault(); go(a.dataset.d); }));
    }
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);

  renderCall(); renderPlaces(); setAge(27); route();
</script>
